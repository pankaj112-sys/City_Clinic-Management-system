<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Patients-Clinic Management System</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="patient.css">
  </head>
  <body>
    <nav class="navbar">
      <div class="logo">
        <h2>Clinic Management</h2>
      </div>
      <div class="nav-links">
         <a href="index.html">Dashboard</a>
        <a href="patients.html">Patients</a>
        <a href="doctors.html">Doctors</a>
        <a href="appointments.html">Appointments</a>
        <a href="#">Logout</a>
      </div>
    </nav>
    <div class="container">
        <aside class="sidebar">
            <h3>Menu</h3>
                    <a href="index.html">Dashboard</a>
                    <a href="patients.html">Patients</a>
                    <a href="doctors.html">Doctors</a>
                    <a href="appointments.html">Appointments</a>
                    <a href="#">Settings</a>
        </aside>
      <main class="main-content">
        <div class="page-header">
          <div>
            <h1>Patients</h1>
            <p>Manage clinic patients</p>
          </div>
          <button class="primary-btn" id="addPatientBtn">Add Patient</button>
        </div>
        <div class="search-box">
          <input type="text" id="searchPatient" placeholder="Search patient" />
        </div>
        <section class="patient-form-section" id="patientFormSection">
          <h2>Add New Patient</h2>
          <form id="patientForm">
            <div class="form-grid">
              <div class="form-group">
                <label for="patientName">Full Name</label>
                <input
                  type="text"
                  id="patientName"
                  placeholder="Enter patient name"
                  required
                />
              </div>
              <div class="form-group">
                <label for="patientAge">Age</label>
                <input
                  type="number"
                  id="patientAge"
                  placeholder="Enter age"
                  required
                />
              </div>
              <div class="form-group">
                <label for="patientGender">Gender</label>
                <select id="patientGender" required>
                  <option value="">Select Gender</option>
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div class="form-group">
                <label for="patientPhone">Phone</label>
                <input
                  type="tel"
                  id="patientPhone"
                  placeholder="Enter phone number"
                  required
                />
              </div>
              <div class="form-group">
                <label for="patientEmail">Email</label>
                <input
                  type="email"
                  id="patientEmail"
                  placeholder="Enter email"
                />
              </div>
              <div class="form-group">
                <label for="patientAddress">Address</label>

                <input
                  type="text"
                  id="patientAddress"
                  placeholder="Enter address"
                />
              </div>
            </div>
            <div class="form-buttons">
              <button type="submit" class="primary-btn">Add Patient</button>
              <button type="reset" class="secondary-btn" id="cancelBtn">
                Cancel
              </button>
            </div>
          </form>
        </section>
        <section class="recent-appointments">
          <div class="table-header">
            <h2>Patient List</h2>
            <span id="patientCount"> 0 Patients </span>
          </div>
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Gender</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="patientTableBody">
              <!-- JavaScript here -->
            </tbody>
          </table>
        </section>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
