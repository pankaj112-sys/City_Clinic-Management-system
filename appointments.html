<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointments-Clinic Management System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="patient.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <h2>Clinic Management</h2>
        </div>
        <div class="nav-links">
            <a href="index.html">Dashboard</a>
            <a href="patients.html">Patients</a>
            <a href="doctors.html">Doctors</a>
            <a href="appointments.html">
                Appointments
            </a>
            <a href="#">Logout</a>
        </div>
    </nav>
    <div class="container">
        <aside class="sidebar">
            <h3>Menu</h3>
            <ul>
                <li>
                    <a href="index.html">
                        Dashboard
                    </a>
                </li>
                <li>
                    <a href="patients.html">
                        Patients
                    </a>
                </li>
                <li>
                    <a href="doctors.html">
                        Doctors
                    </a>
                </li>
                <li>
                    <a href="appointments.html">
                        Appointments
                    </a>
                </li>
                <li>
                    <a href="#">
                        Settings
                    </a>
                </li>
            </ul>
        </aside>
        <main class="main-content">
            <div class="page-header">
                <div>
                    <h1>Appointments</h1>
                    <p>
                        Manage patient appointments
                    </p>
                </div>
                <button class="primary-btn" id="addAppointmentBtn"> New Appointment</button>
            </div>
            <div class="search-box">
                <input type="text" id="searchAppointment" placeholder="Search by patient or doctor...">
            </div>
            <section class="patient-form-section">
                <h2>Book New Appointment</h2>
                <form id="appointmentForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="appointmentPatient">
                                Patient
                            </label>
                            <select id="appointmentPatient" required>
                                <option value=""> Select patient</option>
                                <option value="Rahul Sharma">Rahul Sharma</option>
                                <option value="Amit Kumar">
                                    hello
                                </option>
                                <option value="Priya Singh">
                                    Priya Singh
                                </option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="appointmentDoctor">
                                Doctor
                            </label>
                            <select id="appointmentDoctor" required>
                                <option value="">
                                    Select doctor
                                </option>
                                <option value="Dr. Sharma">
                                    Dr. Sharma
                                </option>
                                <option value="Dr. Verma">
                                    Dr. Verma
                                </option>
                                <option value="Dr. Patel">
                                    Dr. Patel
                                </option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="appointmentDate">
                                Appointment Date
                            </label>
                            <input type="date" id="appointmentDate" required>
                        </div>
                        <div class="form-group">
                            <label for="appointmentTime">
                                Appointment Time
                            </label>
                            <input type="time" id="appointmentTime" required>
                        </div>
                        <div class="form-group">
                            <label for="appointmentReason">
                                Reason
                            </label>
                            <input type="text" id="appointmentReason" placeholder="Reason for visit" required>
                        </div>
                        <div class="form-group">
                            <label for="appointmentStatus">
                                Status
                            </label>
                            <select id="appointmentStatus" required >
                                <option value="Pending">
                                    Pending
                                </option>
                                <option value="Confirmed">
                                    Confirmed
                                </option>
                                <option value="Completed">
                                    Completed
                                </option>
                                <option value="Cancelled">
                                    Cancelled
                                </option>
                            </select>
                        </div>
                    </div>
                    <div class="form-buttons">
                        <button type="submit" class="primary-btn">
                            Book Appointment
                        </button>

                        <button type="reset" class="secondary-btn">
                            Cancel
                        </button>
                    </div>
                </form>
            </section>
            <!-- Appointment List -->
            <section class="recent-appointments">
                <div class="table-header">
                    <h2>Appointment List</h2>
                    <span id="appointmentCount">
                        0 Appointments
                    </span>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Patient</th>
                            <th>Doctor</th>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Reason</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="appointmentTableBody">
                        <!-- Appointments will be added using JavaScript -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
